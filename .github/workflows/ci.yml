name: CI Pipeline

on:
  pull_request:
    branches:
      - main
      - develop
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
      - develop
      - 'feature/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # 1. Quality Assurance & Test Verification Job
  # =========================================================================
  verify:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/ecommerce_test?schema=public"
      REDIS_URL: "redis://localhost:6379"
      JWT_ACCESS_SECRET: "ci_pipeline_jwt_access_secret_test_key_32chars"
      JWT_REFRESH_SECRET: "ci_pipeline_jwt_refresh_secret_test_key_32chars"
      NEXT_PUBLIC_API_URL: "http://localhost:4000/api/v1"
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: 📥 Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: ⚙️ Generate Database Client (Prisma)
        run: pnpm --filter=@ecommerce/database db:generate

      - name: 🔍 Lint Source Code
        run: pnpm lint

      - name: 📐 TypeScript Typecheck
        run: pnpm type-check

      - name: 🧪 Run Unit & Integration Tests
        run: pnpm test

      - name: 🏗️ Build All Packages & Applications
        run: pnpm build

  # =========================================================================
  # 2. Container Image Build Verification Job
  # =========================================================================
  docker-build:
    name: Verify Production Docker Images
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔨 Build API Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.api
          push: false
          tags: novastore-api:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🔨 Build Web Frontend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.web
          push: false
          tags: novastore-web:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
