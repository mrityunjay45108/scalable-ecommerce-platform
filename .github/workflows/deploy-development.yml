name: Deploy to Development (Automated)

on:
  push:
    branches:
      - develop

concurrency:
  group: development-deployment
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

jobs:
  # =========================================================================
  # 1. Quality & Test Verification
  # =========================================================================
  verify-development:
    name: Verify Development Build & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/ecommerce_test?schema=public"
      REDIS_URL: "redis://localhost:6379"
      JWT_ACCESS_SECRET: "ci_pipeline_jwt_access_secret_test_key_32chars"
      JWT_REFRESH_SECRET: "ci_pipeline_jwt_refresh_secret_test_key_32chars"
      NEXT_PUBLIC_API_URL: "http://localhost:4000/api/v1"
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: 📥 Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: ⚙️ Generate Database Client (Prisma)
        run: pnpm --filter=@ecommerce/database db:generate

      - name: 📐 TypeScript Typecheck
        run: pnpm type-check

      - name: 🧪 Execute Test Suites
        run: pnpm test

      - name: 🏗️ Verify Build
        run: pnpm build

  # =========================================================================
  # 2. Continuous Deployment to Development (Render / Cloud Trigger)
  # =========================================================================
  deploy-development:
    name: Trigger Development Deployment
    needs: verify-development
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.repository_owner == 'mrityunjay45108'

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🚀 Deployment Status
        run: |
          echo "✅ Development build & test verification passed successfully."
          echo "🔗 Staging / Development deployment triggered for Render & Vercel."
